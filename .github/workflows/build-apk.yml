
name: RallyBot APK 자동 빌드

on:
  push:
    branches: [main]
    paths:
      - 'RallyBot-project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 앱 소스 압축 풀기
        run: |
          test -f RallyBot-project.zip
          mkdir -p rallybot-source
          unzip -q RallyBot-project.zip -d rallybot-source

      - name: 앱 문구 수정
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("rallybot-source/app/src/main/java/com/crow/rally/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "도적보스 몇 레벨 이하 잡기",
              "도적보스 레벨"
          )
          s = s.replace(
              "예: 70 입력 → 도적보스 Lv.70까지 참여, 75는 제외",
              "설정한 레벨 이하의 도적보스 집결에만 자동 참여합니다."
          )

          assert 'label("도적보스 레벨"' in s
          assert "설정한 레벨 이하의 도적보스 집결에만 자동 참여합니다." in s
          p.write_text(s, encoding="utf-8")
          PY

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: rallybot-source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK 저장
        uses: actions/upload-artifact@v4
        with:
          name: RallyBot-APK
          path: rallybot-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
