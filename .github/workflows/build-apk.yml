
name: RallyBot APK 자동 빌드 및 업데이트 배포

on:
  push:
    branches: [main]
    paths:
      - 'RallyBot-project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 앱 소스 압축 풀기
        run: |
          test -f RallyBot-project.zip
          mkdir -p rallybot-source
          unzip -q RallyBot-project.zip -d rallybot-source
          test -f rallybot-source/settings.gradle.kts
          test -f rallybot-source/app/src/main/java/com/crow/rally/RallyUpdater.kt

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 고정 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.RALLYBOT_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.RALLYBOT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'RALLYBOT_KEYSTORE_BASE64 secret missing'; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo 'RALLYBOT_KEYSTORE_PASSWORD secret missing'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > rallybot-source/signing.p12
          chmod 600 rallybot-source/signing.p12

      - name: 서명된 APK 빌드
        working-directory: rallybot-source
        env:
          RALLYBOT_KEYSTORE_PATH: ${{ github.workspace }}/rallybot-source/signing.p12
          RALLYBOT_SIGNING_PASSWORD: ${{ secrets.RALLYBOT_KEYSTORE_PASSWORD }}
        run: |
          VERSION_CODE=$(( 10000 + GITHUB_RUN_NUMBER ))
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PciVersionCode="$VERSION_CODE" \
            -PciVersionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: 앱 배포 파일 준비
        run: |
          cp rallybot-source/app/build/outputs/apk/release/app-release.apk RallyBot.apk
          sha256sum RallyBot.apk > RallyBot.apk.sha256

      - name: GitHub Releases에 APK 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" \
            RallyBot.apk RallyBot.apk.sha256 \
            --title "RallyBot 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "도적보스 자동 집결 앱 업데이트. 설치 전 Android 시스템 확인이 필요합니다."

      - name: APK 빌드 결과 저장
        uses: actions/upload-artifact@v4
        with:
          name: RallyBot-APK
          path: RallyBot.apk
          if-no-files-found: error
