name: RallyBot APK 자동 빌드

on:
  push:
    branches: [main]
    paths:
      - 'RallyBot-project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 앱 소스 압축 풀기
        run: |
          mkdir -p rallybot-source
          unzip -q RallyBot-project.zip -d rallybot-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK 빌드
        working-directory: rallybot-source
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RallyBot-APK
          path: rallybot-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
